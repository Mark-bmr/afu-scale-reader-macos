name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install audit dependency
        run: brew install ripgrep
      - name: Public repository gate
        run: bash scripts/check-public-repo.sh
      - name: Run tests
        run: swift test --disable-sandbox
      - name: Build release
        run: swift build --disable-sandbox -c release
